name: Python SDK

on:
  push:
    branches: ["main", "python-sdk"]
    paths:
      - "python-sdk/**"
      - ".github/workflows/python-sdk.yml"
  pull_request:
    branches: ["main", "python-sdk"]
    paths:
      - "python-sdk/**"
      - ".github/workflows/python-sdk.yml"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-sdk

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Pandas-dependent tests skip themselves unless the data extra is installed.
      - name: Run Tests
        run: uv run --locked --python 3.13 --extra dev --extra data pytest
