[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "impalab-py"
version = "0.4.1"
description = "Python SDK for Impalab Benchmarking Framework"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Chisomo Makombo Sakala" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "tqdm>=4.0.0",
]

[project.optional-dependencies]
data = [
    "pandas>=1.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.13.2",
    "plotly>=6.0.0",
]
notebook = [
    "ipywidgets>=8.0.0",
]
dev = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/impalab_py"]
